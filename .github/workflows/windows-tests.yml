name: Windows Tests

# CI responsibility split:
# - ci.yml: cross-platform configure/build matrix
# - windows-tests.yml: Windows regression tests (ctest)
# - windows-release.yml: Windows release zip artifact
# - release.yml: tag-based GitHub Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git
            nasm
          path-type: inherit

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $msys2Bash = Join-Path $env:MSYS2_ROOT "usr\bin\bash.exe"
          if ([string]::IsNullOrWhiteSpace($env:MSYS2_ROOT) -or -not (Test-Path $msys2Bash)) {
            throw "MSYS2 bash missing; setup-msys2 output was '$env:MSYS2_ROOT'"
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
            throw "cl.exe not on PATH after msvc-dev-cmd"
          }
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1 -Msys2Root "$env:MSYS2_ROOT"
          if (-not (Test-Path "$env:FFMPEG_MIN_ROOT\include\libavcodec\avcodec.h")) {
            throw "ffmpeg-min headers missing"
          }

      - name: Configure CMake for tests
        shell: pwsh
        run: >-
          cmake -S . -B build-test -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}"
          -DFFMPEG_MIN_ROOT="${env:FFMPEG_MIN_ROOT}"
          -DBUILD_TESTING=ON
          -DCMAKE_CONFIGURATION_TYPES="${env:BUILD_CONFIG}"

      - name: Build test target
        shell: pwsh
        run: cmake --build build-test --config "${env:BUILD_CONFIG}" --target core_regression_tests --parallel

      - name: Run regression tests
        shell: pwsh
        run: ctest --test-dir build-test --build-config "${env:BUILD_CONFIG}" --output-on-failure -R core_regression_tests
