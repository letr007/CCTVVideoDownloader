name: Windows Tests

# CI responsibility split:
# - ci.yml: cross-platform configure/build matrix (macOS/Linux/Windows)
# - windows-tests.yml: Windows regression tests (ctest)
# - windows-release.yml: Windows release zip artifact
# - release.yml: tag-based GitHub Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2 tools for FFmpeg
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\usr\bin;" + $env:Path
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1
          if (-not (Test-Path "third_party/ffmpeg-min/include/libavformat/avformat.h")) {
            throw "ffmpeg-min headers missing"
          }

      - name: Configure CMake for tests
        shell: pwsh
        run: >-
          cmake -S . -B build-test -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}"
          -DFFMPEG_MIN_ROOT="${env:GITHUB_WORKSPACE}/third_party/ffmpeg-min"
          -DBUILD_TESTING=ON
          -DCMAKE_CONFIGURATION_TYPES="${env:BUILD_CONFIG}"

      - name: Build test target
        shell: pwsh
        run: cmake --build build-test --config "${env:BUILD_CONFIG}" --target core_regression_tests --parallel

      - name: Run regression tests
        shell: pwsh
        run: ctest --test-dir build-test --build-config "${env:BUILD_CONFIG}" --output-on-failure -R core_regression_tests
