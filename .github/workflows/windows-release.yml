name: Windows Release Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2 tools for FFmpeg
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\usr\bin;" + $env:Path
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1
          if (-not (Test-Path "third_party/ffmpeg-min/include/libavformat/avformat.h")) {
            throw "ffmpeg-min headers missing"
          }

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}"
          -DFFMPEG_MIN_ROOT="${env:GITHUB_WORKSPACE}/third_party/ffmpeg-min"
          -DCMAKE_CONFIGURATION_TYPES="${env:BUILD_CONFIG}"
          -DBUILD_TESTING=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config "${env:BUILD_CONFIG}" --parallel

      - name: Verify build outputs
        shell: pwsh
        run: |
          $buildDir = "build/${env:BUILD_CONFIG}"
          if (-not (Test-Path "$buildDir/CCTVVideoDownloader.exe")) {
            throw "Missing $buildDir/CCTVVideoDownloader.exe"
          }
          Write-Output "Build outputs verified."

      - name: Create artifact zip
        shell: pwsh
        run: |
          $artifactDir = "artifact"
          $packageDir = Join-Path $artifactDir "CCTVVideoDownloader-windows-x64"
          $zipPath = Join-Path $artifactDir "CCTVVideoDownloader-windows-x64-release.zip"

          if (Test-Path $artifactDir) {
            Remove-Item $artifactDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "build/${env:BUILD_CONFIG}/CCTVVideoDownloader.exe" $packageDir

          # windeployqt for Qt runtime DLLs
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --no-compiler-runtime `
            --no-translations `
            "$packageDir/CCTVVideoDownloader.exe"

          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCTVVideoDownloader-windows-x64-release
          path: artifact/CCTVVideoDownloader-windows-x64-release.zip
          if-no-files-found: error
