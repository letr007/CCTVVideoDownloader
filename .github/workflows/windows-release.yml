name: Windows Release Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git
            nasm
          path-type: inherit

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $msys2Bash = Join-Path $env:MSYS2_ROOT "usr\bin\bash.exe"
          if ([string]::IsNullOrWhiteSpace($env:MSYS2_ROOT) -or -not (Test-Path $msys2Bash)) {
            throw "MSYS2 bash missing; setup-msys2 output was '$env:MSYS2_ROOT'"
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
            throw "cl.exe not on PATH after msvc-dev-cmd"
          }
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1 -Msys2Root "$env:MSYS2_ROOT"
          if (-not (Test-Path "$env:FFMPEG_MIN_ROOT\include\libavcodec\avcodec.h")) {
            throw "ffmpeg-min headers missing"
          }

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}"
          -DFFMPEG_MIN_ROOT="${env:FFMPEG_MIN_ROOT}"
          -DCMAKE_CONFIGURATION_TYPES="${env:BUILD_CONFIG}"
          -DBUILD_TESTING=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config "${env:BUILD_CONFIG}" --parallel

      - name: Verify build outputs
        shell: pwsh
        run: |
          $buildDir = "build/${env:BUILD_CONFIG}"
          if (-not (Test-Path "$buildDir/CCTVVideoDownloader.exe")) {
            throw "Missing $buildDir/CCTVVideoDownloader.exe"
          }
          Write-Output "Build outputs verified."

      - name: Create artifact zip
        shell: pwsh
        run: |
          $artifactDir = "artifact"
          $packageDir = Join-Path $artifactDir "CCTVVideoDownloader-windows-x64"
          $zipPath = Join-Path $artifactDir "CCTVVideoDownloader-windows-x64-release.zip"

          if (Test-Path $artifactDir) {
            Remove-Item $artifactDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "build/${env:BUILD_CONFIG}/CCTVVideoDownloader.exe" $packageDir

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --no-translations `
            "$packageDir/CCTVVideoDownloader.exe"

          foreach ($runtime in "MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll") {
            if (-not (Test-Path (Join-Path $packageDir $runtime))) {
              throw "windeployqt did not deploy required VC runtime: $runtime"
            }
          }
          if (-not (Test-Path (Join-Path $packageDir "platforms/qwindows.dll"))) {
            throw "windeployqt did not deploy the Windows platform plugin"
          }
          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCTVVideoDownloader-windows-x64-release
          path: artifact/CCTVVideoDownloader-windows-x64-release.zip
          if-no-files-found: error
