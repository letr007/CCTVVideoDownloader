name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            compiler: clang
            qt_host: mac
            qt_arch: clang_64
            c_compiler: clang
            cxx_compiler: clang++
          - os: ubuntu-22.04
            compiler: gcc
            qt_host: linux
            qt_arch: linux_gcc_64
            c_compiler: gcc
            cxx_compiler: g++
          - os: windows-2022
            compiler: msvc
            qt_host: windows
            qt_arch: win64_msvc2022_64

    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config yasm nasm zlib1g-dev libbz2-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm pkg-config

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git
            nasm
          path-type: inherit

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: "true"

      - name: Build minimal static FFmpeg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build-ffmpeg-min.sh

      - name: Build minimal static FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1 -Msys2Root "$env:MSYS2_ROOT"

      - name: Configure tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_CONFIG}" \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFFMPEG_MIN_ROOT="${FFMPEG_MIN_ROOT}" \
            -DBUILD_TESTING=ON

      - name: Configure tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DFFMPEG_MIN_ROOT="$env:FFMPEG_MIN_ROOT" `
            -DCMAKE_CONFIGURATION_TYPES="$env:BUILD_CONFIG" `
            -DBUILD_TESTING=ON

      - name: Build test target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --target core_regression_tests --parallel

      - name: Build test target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config "$env:BUILD_CONFIG" --target core_regression_tests --parallel

      - name: Run regression tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure -R core_regression_tests

      - name: Run regression tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir build --build-config "$env:BUILD_CONFIG" --output-on-failure -R core_regression_tests
