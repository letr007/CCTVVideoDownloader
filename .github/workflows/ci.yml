name: CI

# Cross-platform configure/build matrix.
# FFmpeg-min is built with the unified scripts/build-ffmpeg-min.sh entrypoint.
# Platform-specific release packaging remains in windows-release.yml / release.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            compiler: clang
            qt_host: mac
            qt_arch: clang_64
            c_compiler: clang
            cxx_compiler: clang++
          - os: ubuntu-22.04
            compiler: gcc
            qt_host: linux
            qt_arch: gcc_64
            c_compiler: gcc
            cxx_compiler: g++
          - os: windows-2022
            compiler: msvc
            qt_host: windows
            qt_arch: win64_msvc2022_64
            c_compiler: cl
            cxx_compiler: cl

    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            yasm \
            nasm \
            zlib1g-dev \
            libbz2-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install ninja nasm pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: "true"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git
            nasm
          path-type: inherit

      - name: Build minimal static FFmpeg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/build-ffmpeg-min.sh scripts/build-ffmpeg-min-macos.sh
          ./scripts/build-ffmpeg-min.sh
          test -f "${FFMPEG_MIN_ROOT}/include/libavcodec/avcodec.h"
          test -f "${FFMPEG_MIN_ROOT}/include/libavformat/avformat.h"
          ls -lh "${FFMPEG_MIN_ROOT}/lib"

      - name: Build minimal static FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # msys2/setup-msys2 with path-type=inherit puts bash on PATH while
          # keeping MSVC tools (cl/link) visible for --toolchain=msvc.
          if (-not (Get-Command bash -ErrorAction SilentlyContinue)) {
            throw "bash not on PATH after msys2/setup-msys2"
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
            throw "cl.exe not on PATH after msvc-dev-cmd"
          }
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1
          if (-not (Test-Path "$env:FFMPEG_MIN_ROOT\include\libavcodec\avcodec.h")) {
            throw "ffmpeg-min headers missing under $env:FFMPEG_MIN_ROOT"
          }
          Get-ChildItem "$env:FFMPEG_MIN_ROOT\lib" | Format-Table Name, Length

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_CONFIG} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFFMPEG_MIN_ROOT="${FFMPEG_MIN_ROOT}" \
            -DBUILD_TESTING=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DFFMPEG_MIN_ROOT="$env:FFMPEG_MIN_ROOT" `
            -DCMAKE_CONFIGURATION_TYPES="$env:BUILD_CONFIG" `
            -DBUILD_TESTING=OFF

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --config "${BUILD_CONFIG}" --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config "$env:BUILD_CONFIG" --parallel

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            BIN="build/CCTVVideoDownloader"
            if [[ ! -x "$BIN" && -x "build/CCTVVideoDownloader.app/Contents/MacOS/CCTVVideoDownloader" ]]; then
              BIN="build/CCTVVideoDownloader.app/Contents/MacOS/CCTVVideoDownloader"
            fi
          else
            BIN="build/CCTVVideoDownloader"
          fi
          test -x "$BIN"
          ls -lh "$BIN"
          file "$BIN" || true

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build/$env:BUILD_CONFIG/CCTVVideoDownloader.exe"
          if (-not (Test-Path $bin)) { throw "Missing $bin" }
          Get-Item $bin | Format-List FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCTVVideoDownloader-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/CCTVVideoDownloader
            build/CCTVVideoDownloader.app
            build/Release/CCTVVideoDownloader.exe
            build/${{ env.BUILD_CONFIG }}/CCTVVideoDownloader.exe
          if-no-files-found: ignore
