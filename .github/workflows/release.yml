name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-packages:
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish release assets
    needs: build-packages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifact
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifact
          sha256sum CCTVVideoDownloader.*.zip CCTVVideoDownloader.*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifact/CCTVVideoDownloader.*.win.x64.zip
            artifact/CCTVVideoDownloader.*.macos.arm64.zip
            artifact/CCTVVideoDownloader.*.linux.x86_64.tar.gz
            artifact/vc_redist.x64.exe
            artifact/SHA256SUMS
