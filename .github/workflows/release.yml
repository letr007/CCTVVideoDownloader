name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            pkgconf
            tar
            git
            nasm
          path-type: inherit

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-min-windows.ps1 -Msys2Root "$env:MSYS2_ROOT"

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DFFMPEG_MIN_ROOT="$env:FFMPEG_MIN_ROOT" `
            -DCMAKE_CONFIGURATION_TYPES="$env:BUILD_CONFIG" `
            -DBUILD_TESTING=OFF
          cmake --build build --config "$env:BUILD_CONFIG" --parallel

      - name: Package Windows distribution
        shell: pwsh
        run: |
          $packageDir = "artifact/CCTVVideoDownloader"
          $zipPath = "artifact/CCTVVideoDownloader.${{ github.ref_name }}.win.x64.zip"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "build/$env:BUILD_CONFIG/CCTVVideoDownloader.exe" $packageDir
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$packageDir/CCTVVideoDownloader.exe"
          $vcRuntimeDir = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
          foreach ($runtime in "MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll") {
            $source = Join-Path $vcRuntimeDir $runtime
            if (-not (Test-Path $source)) {
              throw "MSVC runtime missing from toolchain: $source"
            }
            Copy-Item $source $packageDir
          }
          if (-not (Test-Path (Join-Path $packageDir "platforms/qwindows.dll"))) {
            throw "windeployqt did not deploy the Windows platform plugin"
          }
          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "artifact/vc_redist.x64.exe"

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            artifact/CCTVVideoDownloader.${{ github.ref_name }}.win.x64.zip
            artifact/vc_redist.x64.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS arm64
    runs-on: macos-14
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ninja nasm pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: mac
          target: desktop
          arch: clang_64
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: bash
        run: ./scripts/build-ffmpeg-min.sh

      - name: Configure, build, and install app bundle
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_CONFIG}" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFFMPEG_MIN_ROOT="${FFMPEG_MIN_ROOT}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/artifact/CCTVVideoDownloader" \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Package macOS distribution
        shell: bash
        run: |
          app="artifact/CCTVVideoDownloader/CCTVVideoDownloader.app"
          zip="artifact/CCTVVideoDownloader.${{ github.ref_name }}.macos.arm64.zip"
          test -x "$app/Contents/MacOS/CCTVVideoDownloader"
          test -d "$app/Contents/Frameworks/QtCore.framework"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: artifact/CCTVVideoDownloader.${{ github.ref_name }}.macos.arm64.zip
          if-no-files-found: error

  package-linux:
    name: Package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BUILD_CONFIG: Release
      FFVER: "7.1.1"
      FFMPEG_MIN_ROOT: ${{ github.workspace }}/third_party/ffmpeg-min

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config yasm nasm zlib1g-dev libbz2-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: "true"

      - name: Build minimal static FFmpeg
        shell: bash
        run: ./scripts/build-ffmpeg-min.sh

      - name: Configure, build, and install distribution
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_CONFIG}" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFFMPEG_MIN_ROOT="${FFMPEG_MIN_ROOT}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/artifact/CCTVVideoDownloader" \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Package Linux distribution
        shell: bash
        run: |
          package_dir="artifact/CCTVVideoDownloader"
          archive="artifact/CCTVVideoDownloader.${{ github.ref_name }}.linux.x86_64.tar.gz"
          test -x "$package_dir/bin/CCTVVideoDownloader"
          find "$package_dir" -name 'libQt6Core.so*' -print -quit | grep -q .
          find "$package_dir" -path '*/platforms/libqxcb.so' -print -quit | grep -q .
          tar -C artifact -czf "$archive" CCTVVideoDownloader

      - name: Upload Linux asset
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifact/CCTVVideoDownloader.${{ github.ref_name }}.linux.x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [package-windows, package-macos, package-linux]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifact
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifact
          sha256sum CCTVVideoDownloader.*.zip CCTVVideoDownloader.*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifact/CCTVVideoDownloader.*.win.x64.zip
            artifact/CCTVVideoDownloader.*.macos.arm64.zip
            artifact/CCTVVideoDownloader.*.linux.x86_64.tar.gz
            artifact/vc_redist.x64.exe
            artifact/SHA256SUMS
