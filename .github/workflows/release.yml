name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-packages:
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish release assets
    needs: build-packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifact
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifact
          sha256sum CCTVVideoDownloader.*.zip CCTVVideoDownloader.*.dmg CCTVVideoDownloader.*.tar.gz CCTVVideoDownloader.*.AppImage cctv-dl.*.win.x64.zip cctv-dl.*.macos.arm64.tar.gz cctv-dl.*.linux.x86_64.tar.gz vc_redist.x64.exe > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelogs/${{ github.ref_name }}.md
          files: |
            artifact/CCTVVideoDownloader.*.win.x64.zip
            artifact/CCTVVideoDownloader.*.macos.arm64.zip
            artifact/CCTVVideoDownloader.*.macos.arm64.dmg
            artifact/CCTVVideoDownloader.*.linux.x86_64.tar.gz
            artifact/CCTVVideoDownloader.*.linux.x86_64.AppImage
            artifact/cctv-dl.*.win.x64.zip
            artifact/cctv-dl.*.macos.arm64.tar.gz
            artifact/cctv-dl.*.linux.x86_64.tar.gz
            artifact/vc_redist.x64.exe
            artifact/SHA256SUMS
